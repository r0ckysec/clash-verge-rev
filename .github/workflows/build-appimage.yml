name: Build Debian AppImage (amd64)

on:
  workflow_dispatch:  # 手动触发
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions: write-all

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  HUSKY: 0

jobs:
  build-appimage:
    name: Build AppImage for Debian amd64
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust Target
        run: rustup target add x86_64-unknown-linux-gnu

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: false

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxslt1.1 \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libwebkit2gtk-4.1-dev

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install Dependencies
        run: |
          pnpm i
          pnpm run prebuild x86_64-unknown-linux-gnu

      - name: Create AppImage Config
        run: |
          # 备份原始配置
          cp src-tauri/tauri.linux.conf.json src-tauri/tauri.linux.conf.json.backup

          # 创建包含 AppImage 的配置
          cat > src-tauri/tauri.linux.appimage.conf.json << 'EOF'
          {
            "$schema": "../node_modules/@tauri-apps/cli/config.schema.json",
            "identifier": "io.github.clash-verge-rev.clash-verge-rev",
            "bundle": {
              "targets": ["appimage"],
              "linux": {
                "appimage": {
                  "bundleMediaFramework": true
                }
              },
              "externalBin": [
                "./resources/clash-verge-service",
                "./resources/clash-verge-service-install",
                "./resources/clash-verge-service-uninstall",
                "./sidecar/verge-mihomo",
                "./sidecar/verge-mihomo-alpha"
              ]
            }
          }
          EOF

      - name: Build AppImage
        run: |
          # 使用 AppImage 配置构建
          pnpm tauri build --target x86_64-unknown-linux-gnu --config src-tauri/tauri.linux.appimage.conf.json
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Get Version
        id: version
        run: |
          VERSION=$(jq -r .version package.json)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "BUILDTIME=$(TZ=Asia/Shanghai date)" >> $GITHUB_ENV

      - name: List Build Artifacts
        run: |
          echo "=== Build artifacts ==="
          find src-tauri/target/x86_64-unknown-linux-gnu/release/bundle -type f
          echo "======================"

      - name: Upload AppImage as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: clash-verge-rev_${{ env.VERSION }}_amd64.AppImage
          path: src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
          retention-days: 30

      - name: Create Release (Optional)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: appimage-${{ env.VERSION }}
          name: "Clash Verge Rev AppImage v${{ env.VERSION }}"
          body: |
            ## Debian/Ubuntu AppImage Build

            **Architecture:** amd64 (x86_64)
            **Build Time:** ${{ env.BUILDTIME }}

            ### Installation

            ```bash
            # 下载后添加执行权限
            chmod +x Clash.Verge_${{ env.VERSION }}_amd64.AppImage

            # 运行
            ./Clash.Verge_${{ env.VERSION }}_amd64.AppImage
            ```

            ### System Requirements
            - Debian 11+ / Ubuntu 22.04+ or compatible distributions
            - x86_64 (amd64) architecture
            - FUSE (usually pre-installed)

          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage.tar.gz
